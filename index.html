<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f6f2e8">
<title>公理板</title>
<link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
<script>try{var t=JSON.parse(localStorage.getItem("axiom-simple:settings")||"{}").theme;if(t==="dark")document.documentElement.dataset.theme="dark";}catch(e){}</script>
<link rel="stylesheet" href="src/simple.css">
</head>
<body>
<div class="app">
  <header class="topbar">
    <button class="level-num" id="levelBtn" aria-label="选择关卡">01</button>
    <div class="goal" id="goal">
      <span class="turnstile">⊢</span>
      <span class="formula" id="goalFormula"></span>
    </div>
    <div class="actions">
      <button class="round-btn theme-btn" id="themeBtn" aria-label="切换深色模式"><svg class="icon"><use href="#i-moon"></use></svg></button>
      <button class="round-btn sound-btn" id="soundBtn" aria-label="音乐开关"><svg class="icon"><use href="#i-speaker-wave"></use></svg></button>
      <button class="round-btn" id="helpBtn" aria-label="操作说明"><svg class="icon"><use href="#i-question-mark-circle"></use></svg></button>
      <button class="round-btn" id="achvBtn" aria-label="成就"><svg class="icon"><use href="#i-trophy"></use></svg></button>
      <button class="check-btn" id="checkBtn" aria-label="校验"><svg class="icon"><use href="#i-play"></use></svg></button>
    </div>
  </header>
  <div class="progress" aria-hidden="true"><i id="progressFill"></i></div>

  <main class="stage">
    <div class="board" id="board">
      <div class="board-world" id="boardWorld">
        <svg class="wires" id="wireLayer" aria-hidden="true"></svg>
        <div class="nodes" id="nodeLayer"></div>
      </div>
      <div class="coach" id="coach" hidden>
        <span class="coach-tile">A1</span>
        <span class="coach-arrow">→</span>
        <span class="coach-goal">⊢</span>
      </div>
      <div class="coach-pop" id="coachPop" hidden role="dialog" aria-label="规则提示"></div>
    </div>
  </main>

  <footer class="tray" id="tray" aria-label="可用元件"></footer>

  <div class="popover" id="popover" hidden></div>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <div class="overlay" id="overlay" hidden>
    <div class="sheet" id="sheet" role="dialog" aria-modal="true"></div>
  </div>
</div>

<audio id="bgm" src="assets/audio/grassland.mp3" loop preload="metadata"></audio>

<svg class="icon-sprite" aria-hidden="true"><defs>
  <symbol id="i-moon" viewBox="0 0 24 24"><path d="M21.752 15.002A9.72 9.72 0 0 1 18 15.75c-5.385 0-9.75-4.365-9.75-9.75 0-1.33.266-2.597.748-3.752A9.753 9.753 0 0 0 3 11.25C3 16.635 7.365 21 12.75 21a9.753 9.753 0 0 0 9.002-5.998Z"/></symbol>
  <symbol id="i-sun" viewBox="0 0 24 24"><path d="M12 3v2.25m6.364.386-1.591 1.591M21 12h-2.25m-.386 6.364-1.591-1.591M12 18.75V21m-4.773-4.227-1.591 1.591M5.25 12H3m4.227-4.773L5.636 5.636M15.75 12a3.75 3.75 0 1 1-7.5 0 3.75 3.75 0 0 1 7.5 0Z"/></symbol>
  <symbol id="i-speaker-wave" viewBox="0 0 24 24"><path d="M19.114 5.636a9 9 0 0 1 0 12.728M16.463 8.288a5.25 5.25 0 0 1 0 7.424M6.75 8.25l4.72-4.72a.75.75 0 0 1 1.28.53v15.88a.75.75 0 0 1-1.28.53l-4.72-4.72H4.51c-.88 0-1.704-.507-1.938-1.354A9.009 9.009 0 0 1 2.25 12c0-.83.112-1.633.322-2.396C2.806 8.756 3.63 8.25 4.51 8.25H6.75Z"/></symbol>
  <symbol id="i-speaker-x-mark" viewBox="0 0 24 24"><path d="M17.25 9.75 19.5 12m0 0 2.25 2.25M19.5 12l2.25-2.25M19.5 12l-2.25 2.25m-10.5-6 4.72-4.72a.75.75 0 0 1 1.28.53v15.88a.75.75 0 0 1-1.28.53l-4.72-4.72H4.51c-.88 0-1.704-.507-1.938-1.354A9.009 9.009 0 0 1 2.25 12c0-.83.112-1.633.322-2.396C2.806 8.756 3.63 8.25 4.51 8.25H6.75Z"/></symbol>
  <symbol id="i-question-mark-circle" viewBox="0 0 24 24"><path d="M9.879 7.519c1.171-1.025 3.071-1.025 4.242 0 1.172 1.025 1.172 2.687 0 3.712-.203.179-.43.326-.67.442-.745.361-1.45.999-1.45 1.827v.75M21 12a9 9 0 1 1-18 0 9 9 0 0 1 18 0Zm-9 5.25h.008v.008H12v-.008Z"/></symbol>
  <symbol id="i-trophy" viewBox="0 0 24 24"><path d="M8 21h8M12 17v4M7 4h10v5a5 5 0 0 1-10 0V4ZM7 6H4v2a3 3 0 0 0 3 3M17 6h3v2a3 3 0 0 1-3 3"/></symbol>
  <symbol id="i-check" viewBox="0 0 24 24"><path d="m4.5 12.75 6 6 9-13.5"/></symbol>
  <symbol id="i-play" viewBox="0 0 24 24"><path d="M5.25 5.653c0-.856.917-1.398 1.667-.986l11.54 6.347a1.125 1.125 0 0 1 0 1.972l-11.54 6.347a1.125 1.125 0 0 1-1.667-.986V5.653Z"/></symbol>
  <symbol id="i-x-mark" viewBox="0 0 24 24"><path d="M6 18 18 6M6 6l12 12"/></symbol>
</defs></svg>

<script src="src/logic.js"></script>
<script src="src/archive.js"></script>
<script src="src/library.js"></script>
<script src="src/levels.js"></script>
<script src="src/levels-generated.js"></script>
<script src="src/engine.js"></script>
<script src="src/board.js"></script>
<script src="src/main.js"></script>
</body>
</html>
