<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f7f2e7">
<meta name="description" content="RusselL · 公理板：基于 Metamath set.mm 的接线证明游戏。154 关，四章命题、谓词、等词与集合论。">
<title>RusselL · 公理板</title>
<link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
<script>try{var t=JSON.parse(localStorage.getItem("axiom-simple:settings")||"{}").theme;if(t==="dark")document.documentElement.dataset.theme="dark";}catch(e){}</script>
<link rel="stylesheet" href="src/simple.css">
</head>
<body>
<div class="app">
  <header class="topbar">
    <button class="level-num" id="levelBtn" aria-label="选择关卡">01</button>
    <div class="goal" id="goal">
      <span class="turnstile">⊢</span>
      <span class="formula" id="goalFormula"></span>
    </div>
    <div class="actions">
      <button class="round-btn theme-btn" id="themeBtn" aria-label="切换深色模式"><svg class="icon"><use href="#i-moon"></use></svg></button>
      <button class="round-btn sound-btn" id="soundBtn" aria-label="音乐开关"><svg class="icon"><use href="#i-speaker-wave"></use></svg></button>
      <button class="round-btn" id="helpBtn" aria-label="操作说明"><svg class="icon"><use href="#i-question-mark-circle"></use></svg></button>
      <button class="round-btn" id="achvBtn" aria-label="成就"><svg class="icon"><use href="#i-trophy"></use></svg></button>
      <button class="round-btn" id="godBtn" hidden aria-label="按参考解布置" title="按参考解布置"><svg class="icon"><use href="#i-bolt"></use></svg></button>
      <button class="round-btn" id="hintBtn" hidden aria-label="提示" title="提示"><svg class="icon"><use href="#i-light-bulb"></use></svg></button>
      <button class="round-btn" id="rankBtn" hidden aria-label="排行榜" title="排行榜"><svg class="icon"><use href="#i-chart-bar"></use></svg></button>
      <button class="check-btn" id="checkBtn" aria-label="校验"><svg class="icon"><use href="#i-play"></use></svg></button>
    </div>
  </header>
  <div class="progress" aria-hidden="true"><i id="progressFill"></i></div>

  <main class="stage">
    <div class="board" id="board">
      <div class="board-world" id="boardWorld">
        <svg class="wires" id="wireLayer" aria-hidden="true"></svg>
        <div class="nodes" id="nodeLayer"></div>
      </div>
      <div class="tutorial-tip" id="tutorialTip" hidden></div>
    </div>
  </main>

  <footer class="tray" id="tray" aria-label="可用元件"></footer>

  <div class="popover" id="popover" hidden></div>
  <input id="saveFile" type="file" accept=".json,application/json" hidden>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <div class="overlay" id="overlay" hidden>
    <div class="sheet" id="sheet" role="dialog" aria-modal="true"></div>
    <div class="sheet-bar" id="sheetBar" hidden><i></i></div>
  </div>
</div>

<audio id="bgm" src="assets/audio/grassland.mp3" loop preload="metadata"></audio>
