<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f6f2e8">
<title>公理板</title>
<link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="src/simple.css">
</head>
<body>
<div class="app">
  <header class="topbar">
    <button class="level-num" id="levelBtn" aria-label="选择关卡">01</button>
    <div class="goal" id="goal">
      <span class="turnstile">⊢</span>
      <span class="formula" id="goalFormula"></span>
    </div>
    <div class="actions">
      <button class="round-btn delete-btn" id="deleteBtn" aria-label="删除所选" hidden>×</button>
      <button class="round-btn" id="helpBtn" aria-label="操作说明">?</button>
      <button class="check-btn" id="checkBtn">校验</button>
    </div>
  </header>

  <main class="stage">
    <div class="board" id="board">
      <div class="board-world" id="boardWorld">
        <svg class="wires" id="wireLayer" aria-hidden="true"></svg>
        <div class="nodes" id="nodeLayer"></div>
      </div>
      <div class="coach" id="coach" hidden>
        <span class="coach-tile">A1</span>
        <span class="coach-arrow">→</span>
        <span class="coach-goal">⊢</span>
      </div>
    </div>
  </main>

  <footer class="tray" id="tray" aria-label="可用元件"></footer>

  <div class="popover" id="popover" hidden></div>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <div class="overlay" id="overlay" hidden>
    <div class="sheet" id="sheet" role="dialog" aria-modal="true"></div>
  </div>
</div>

<script src="src/logic.js"></script>
<script src="src/theorems.js"></script>
<script src="src/metamath.js"></script>
<script src="src/predicate.js"></script>
<script src="src/library.js"></script>
<script src="src/levels.js"></script>
<script src="src/engine.js"></script>
<script src="src/board.js"></script>
<script src="src/main.js"></script>
</body>
</html>
