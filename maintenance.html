<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f3efe4">
<title>公理板 · 维护中</title>
<style>
  :root{
    --paper:#f3efe4; --card:#fbf8ef; --ink:#24251f; --muted:#777267;
    --line:#dcd5c3; --orange:#cf643f; --green:#557c58;
    --radius:18px; --shadow:0 1px 2px rgba(52,44,28,.05),0 18px 44px -24px rgba(52,44,28,.28);
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0; background:var(--paper); color:var(--ink);
    font-family:"Noto Sans SC","PingFang SC","Microsoft YaHei",system-ui,sans-serif;
    display:grid; place-items:center; padding:24px;
  }
  main{width:min(560px,100%);text-align:center}
  .mark{
    width:82px;height:82px;margin:0 auto 26px;border-radius:22px;
    display:grid;place-items:center;
    background:var(--card);border:1.5px solid var(--line);
    box-shadow:var(--shadow);color:var(--orange);
    font-family:"Cambria Math","STIX Two Math",serif;font-size:42px;font-weight:600;
  }
  h1{
    margin:0;font-family:"Noto Serif SC","Songti SC","SimSun",serif;
    font-size:clamp(26px,6vw,36px);font-weight:600;letter-spacing:.02em;
  }
  p{margin:14px 0 0;color:var(--muted);font-size:15px;line-height:1.8}
  .rule{
    width:54px;height:2px;margin:30px auto 0;border-radius:2px;
    background:linear-gradient(90deg,var(--green),var(--orange));opacity:.8;
  }
  .note{
    display:inline-block;margin-top:26px;padding:8px 16px;border-radius:999px;
    background:var(--card);border:1px solid var(--line);
    font-size:12px;letter-spacing:.06em;color:var(--muted);
  }
</style>
</head>
<body>
<main>
  <div class="mark" aria-hidden="true">⊢</div>
  <h1>公理板正在重构</h1>
  <p>关卡顺序、难度和证明结构都在重做。<br>网页版暂时关闭，完成后再开放。</p>
  <div class="rule" aria-hidden="true"></div>
  <span class="note">MAINTENANCE · BACK SOON</span>
</main>
</body>
</html>
