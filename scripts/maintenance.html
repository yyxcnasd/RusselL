<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f7f2e7">
<meta name="robots" content="noindex">
<meta name="description" content="公理板正在升级：底层表达式与关卡系统重构中，暂时关闭游戏。">
<title>公理板 · 正在升级</title>
<link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
<style>
  :root{
    --bg:#f7f2e7; --paper:#fffdf7; --ink:#2b2620; --muted:#8a8172;
    --line:#e4dccb; --accent:#e66f3f; --soft:#f2ece0;
    --font:"IBM Plex Sans","PingFang SC","Source Han Sans SC","Microsoft YaHei",sans-serif;
    --math:"STIX Two Text",Georgia,serif;
  }
  @font-face{font-family:"IBM Plex Sans";src:url("assets/fonts/IBMPlexSans-Regular.woff2") format("woff2");font-weight:400;font-display:swap}
  @font-face{font-family:"IBM Plex Sans";src:url("assets/fonts/IBMPlexSans-Medium.woff2") format("woff2");font-weight:500;font-display:swap}
  @font-face{font-family:"IBM Plex Sans";src:url("assets/fonts/IBMPlexSans-SemiBold.woff2") format("woff2");font-weight:600;font-display:swap}
  @font-face{font-family:"STIX Two Text";src:url("assets/fonts/STIXTwoText-Regular.woff2") format("woff2");font-weight:400;font-display:swap}
  @font-face{font-family:"STIX Two Text";src:url("assets/fonts/STIXTwoText-Italic.woff2") format("woff2");font-style:italic;font-display:swap}
  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0;padding:24px;display:grid;place-items:center;
    background:var(--bg);color:var(--ink);font-family:var(--font);
    -webkit-font-smoothing:antialiased;
  }
  .card{
    width:min(560px,100%);
    background:var(--paper);border:1.5px solid var(--line);border-radius:22px;
    box-shadow:0 3px 0 rgba(43,38,32,.08), 0 18px 40px rgba(43,38,32,.06);
    padding:34px 32px 30px;
  }
  .mark{font-family:var(--math);font-size:44px;line-height:1;color:var(--accent);margin:0 0 14px}
  h1{margin:0 0 10px;font-size:24px;font-weight:600;letter-spacing:.01em}
  p{margin:0 0 12px;font-size:15px;line-height:1.7;color:var(--ink)}
  .muted{color:var(--muted);font-size:13px;line-height:1.7}
  .tag{
    display:inline-flex;align-items:center;gap:8px;margin-bottom:18px;
    padding:5px 12px;border-radius:999px;background:var(--soft);color:var(--muted);
    font-size:12px;font-weight:600;letter-spacing:.04em;
  }
  .dot{width:8px;height:8px;border-radius:50%;background:var(--accent);animation:pulse 1.8s ease-in-out infinite}
  @keyframes pulse{0%,100%{opacity:.35}50%{opacity:1}}
  hr{border:0;border-top:1px solid var(--line);margin:20px 0 16px}
  a{color:var(--accent);text-decoration:none}
  a:hover{text-decoration:underline}
  .formula{
    font-family:var(--math);font-size:20px;text-align:center;color:var(--muted);
    padding:14px 0 4px;letter-spacing:.02em;
  }
  @media (prefers-reduced-motion:reduce){ .dot{animation:none} }
</style>
</head>
<body>
  <main class="card">
    <div class="mark" aria-hidden="true">⊢</div>
    <span class="tag"><i class="dot" aria-hidden="true"></i>维护中 · UNDER CONSTRUCTION</span>
    <h1>公理板正在升级</h1>
    <p>我们正在重写底层的公式与关卡系统，把「接线关」和「证明重放关」合并成同一套运行时。升级完成前暂时关闭游戏，避免你玩到一半的进度与界面在切换时错乱。</p>
    <p class="muted">已完成的部分：set.mm 证明重放器、48 个重放关、统一难度曲线。<br>正在做：唯一表达式核心、统一模块与关卡流程；完成后这里会自动恢复。</p>
    <hr>
    <p class="muted">存档在浏览器本地（localStorage），升级不会清空；恢复后继续玩即可。</p>
    <p class="muted">进度与源码：<a href="https://github.com/yyxcnasd/RusselL" rel="noopener">github.com/yyxcnasd/RusselL</a></p>
    <div class="formula" aria-hidden="true">∀x ( 升级 → 更好的公理板 )</div>
  </main>
</body>
</html>
